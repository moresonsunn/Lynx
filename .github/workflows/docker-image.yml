name: Build and Push Lynx Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'Dockerfile*'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (leave empty for auto)'
        required: false
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: moresonsun/lynx
  DOCKERFILE: docker/controller-unified.Dockerfile

jobs:
  # ============================================
  # 1. Multi-Arch Docker Build & Push
  # ============================================
  build:
    name: Build and Push Multi-Arch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.DATE }}-${{ steps.version.outputs.VERSION }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 2. Discord Notification (optional)
  # ============================================
  notify:
    name: Notify on completion
    runs-on: ubuntu-latest
    needs: build
    if: always() # Läuft immer, auch wenn build fehlschlägt
    steps:
      - name: Send success notification to Discord
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "✅ Lynx Docker Image built successfully!"
          description: |
            **Repository:** ${{ github.repository }}
            **Version:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Image:** `moresonsun/lynx:latest`
            **Triggered by:** ${{ github.actor }}
          color: 0x00ff00  # Grün
          footer: "Lynx CI/CD"
          timestamp: true

      - name: Send failure notification to Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "❌ Lynx Docker Image build failed!"
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Triggered by:** ${{ github.actor }}
            **Check the logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0xff0000  # Rot
          footer: "Lynx CI/CD"
          timestamp: true
            Image: moresonsun/lynx:latest
            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

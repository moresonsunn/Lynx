# Default compose file for Lynx unified deployment
# Build & run:
#   docker compose up -d --build

services:
  lynx:
    image: moresonsun/lynx:latest
    build:
      context: .
      dockerfile: docker/controller-unified.Dockerfile
      args:
        - APP_VERSION=${BLOCKPANEL_TAG:-dev}
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Lynx
      - APP_VERSION=latest
      - USE_POSTGRES=false
      - DATABASE_URL=sqlite:////data/sqlite/minecraft_controller.db
      - SERVERS_CONTAINER_ROOT=/data/servers
      - SERVERS_VOLUME_NAME=minecraft-controller_servers_data
      - BLOCKPANEL_RUNTIME_IMAGE=moresonsun/lynx
      - BLOCKPANEL_RUNTIME_TAG=latest
      - DOCKER_HOST=unix:///var/run/docker.sock
      - ENVIRONMENT=production
      # SECURITY: Set a strong SECRET_KEY in .env — sessions invalidate on restart otherwise.
      # Generate one with: python -c "import secrets; print(secrets.token_urlsafe(64))"
      - SECRET_KEY=${SECRET_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # SECURITY: Only set ADMIN_PASSWORD for the initial bootstrap or a deliberate
      # reset; remove it afterwards. Weak values are rejected by the backend (<8 chars).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Lock CORS down to your origin(s). Comma-separated list, or set
      # ALLOWED_ORIGIN_REGEX for advanced matching. Wildcard .* is NOT safe in production.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
      - ALLOWED_ORIGIN_REGEX=${ALLOWED_ORIGIN_REGEX:-}
      # Debug endpoints echo request headers — keep off unless troubleshooting.
      - ENABLE_DEBUG_ENDPOINTS=0
      - CASAOS_APP_ID=lynx
      # CasaOS v2 compose apps (Steam servers)
      - CASAOS_API_BASE=${CASAOS_API_BASE:-}
      - CASAOS_API_TOKEN=${CASAOS_API_TOKEN:-}
      # Disable insecure Steam Docker TCP ports (security fix)
      - STEAM_DOCKER_HOST=
    volumes:
      - servers_data:/data/servers
      - sqlite_data:/data/sqlite
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/quick"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    labels:
      io.casaos.app: "lynx"
      io.casaos.managed: "true"
      io.casaos.category: "Game Servers"

volumes:
  servers_data:
  sqlite_data:
